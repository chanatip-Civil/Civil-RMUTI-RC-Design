<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civil RMUTI RC Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#162033;--tx:#e2e8f0;--mu:#94a3b8;--ln:#2a3a55;--inp:#0f172a}}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--ln);border-radius:8px}
.ph{padding:8px 14px;border-bottom:1px solid var(--ln);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.inp{width:100%;border:1px solid var(--ln);border-radius:6px;padding:5px 8px;background:var(--inp);color:var(--tx)}
.inp:focus{outline:2px solid #2563eb;outline-offset:-1px}
.mu{color:var(--mu)}
.btn{padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;transition:.15s}
.btn-p{background:#2563eb;color:#fff}.btn-p:hover{background:#1d4ed8}
.btn-s{border:1px solid var(--ln)}.btn-s:hover{background:rgba(148,163,184,.18)}
.sb{background:#0f172a;color:#cbd5e1}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:6px;text-align:left;border-left:3px solid transparent}
.nav:hover:not(:disabled){background:#1e293b;color:#fff}
.nav.on{background:#1e3a8a;color:#fff;border-left-color:#60a5fa}
.nav:disabled{opacity:.4;cursor:not-allowed}
.sub{padding:5px 12px 5px 42px;font-size:12px}.sbtn{width:100%;padding:8px;border-radius:6px;font-weight:600;font-size:13px}
@media print{.noprint,.sb{display:none!important}html,body,#app{height:auto!important}main{overflow:visible!important;padding:0!important}body{background:#fff!important}:root:not([data-theme="light"]){--bg:#fff;--panel:#fff;--tx:#000;--mu:#555;--ln:#ccc;--inp:#fff}.panel{border:0!important}}
.pdfwrap .lg\:grid-cols-2,.pdfwrap .sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
</head>
<body>
<div id="app" class="flex h-full"></div>
<script>
const $=s=>document.querySelector(s);
const MODS={
 dashboard:{th:'แดชบอร์ด',en:'Dashboard',icon:'◧'},
 beam:{th:'คาน',en:'Beam Design',icon:'▬',ready:1},
 column:{th:'เสา',en:'Column Design',icon:'▮'},
 slab:{th:'พื้น',en:'Slab Design',icon:'▦',ready:1},
 stair:{th:'บันได',en:'Stair Design',icon:'⌗',ready:1},
 foundation:{th:'ฐานราก',en:'Foundation Design',icon:'⏥'},
 export:{th:'ส่งออก',en:'Export',icon:'⇪'}};
const BEAM_DEF={oneRow:false,phiF:.9,phiV:.85,Es:2040000,EcAuto:true,Ec:233000,legs:2,Vu:10,useVu:false,s:15,mode:'design',support:'simple',useMu:false,Mu:10,b:25,h:50,cover:4,L:6,fc:240,fy:4000,wD:1.5,wL:1.0,selfWt:true,bar:20,barC:16,stir:9,n:3,nc:0};
let state={page:'dashboard',project:null,logo:null,navOpen:false,collapsed:false,unit:'metric',exp:{sel:{},opts:{cover:true,summary:true,inputs:true,results:true},tpl:'basic'}};
try{state.logo=localStorage.getItem('rc_logo')}catch(e){}
try{state.unit=localStorage.getItem('rc_unit')||'metric'}catch(e){}
function lastProject(){try{return JSON.parse(localStorage.getItem('rc_last')||'null')}catch(e){return null}}
function autosave(){try{if(state.project)localStorage.setItem('rc_last',JSON.stringify(state.project))}catch(e){}}
function go(p){state.page=p;state.navOpen=false;if(state.project&&p!=='dashboard'&&p!=='export'){const its=state.project.items.filter(i=>i.type===p);if(!its.find(i=>i.id===state.item))state.item=its[0]?its[0].id:null}render()}

/* project */
function newProject(name,eng,cli,code){
 state.project={meta:{name,engineer:eng,client:cli,code,unit:state.unit,created:new Date().toISOString().slice(0,10)},items:[]};state.project.items.push(mkItem('beam'));state.item=state.project.items[0].id;
 autosave();go('dashboard')}
function loadProject(t){try{const p=JSON.parse(t);if(!p.meta||!(p.items||p.modules))throw 0;if(!p.items){p.items=[];if(p.modules&&p.modules.beam)p.items.push({id:'i0',type:'beam',name:'B1',desc:'',data:p.modules.beam});delete p.modules}
 p.items.forEach((i,k)=>{i.id=i.id||'i'+k;if(i.type==='beam')i.data={...BEAM_DEF,...i.data};if(i.type==='stair')i.data={...STAIR_DEF,...i.data};if(i.type==='slab')i.data={...SLAB_DEF,...i.data}});if(p.meta.unit&&UN[p.meta.unit])state.unit=p.meta.unit;state.project=p;state.item=(p.items.find(i=>i.type==='beam')||{}).id;autosave();go('dashboard')}catch(e){alert('ไฟล์ไม่ถูกต้อง / Invalid project file')}}

/* logo */
function pickLogo(f){
 if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,256/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.logo=c.toDataURL('image/png');try{localStorage.setItem('rc_logo',state.logo)}catch(e){}render()};im.src=r.result};
 r.readAsDataURL(f)}

function logoImg(sz){const c=state.logo?`<img src="${state.logo}" alt="RMUTI" class="w-full h-full object-contain">`:`<span class="text-[9px] leading-tight text-slate-500 text-center">ตรา<br>มอ.</span>`;return `<label class="${sz} rounded-full bg-white overflow-hidden flex items-center justify-center shrink-0 cursor-pointer ring-2 ring-blue-900" title="คลิกเพื่อเปลี่ยนโลโก้">${c}<input type="file" accept="image/*" class="hidden" onchange="pickLogo(this.files[0])"></label>`}
function toggleNav(){if(window.innerWidth>=1024)state.collapsed=!state.collapsed;else state.navOpen=true;render()}
/* modals */
function modal(h){closeModal();const d=document.createElement('div');d.id='modal';d.className='fixed inset-0 z-50 flex items-center justify-center p-4';d.style.background='rgba(15,23,42,.6)';d.innerHTML=`<div class="panel w-full max-w-lg p-5 shadow-2xl">${h}</div>`;document.body.appendChild(d)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function showNew(){modal(`<h2 class="text-lg font-bold mb-4">โครงการใหม่ · New Project</h2><div class="space-y-3">
 <label class="block">ชื่อโครงการ<input id="n_name" class="inp mt-1" value="Untitled Project"></label>
 <label class="block">วิศวกรผู้ออกแบบ<input id="n_eng" class="inp mt-1"></label>
 <label class="block">เจ้าของงาน<input id="n_cli" class="inp mt-1"></label>
 <label class="block">มาตรฐาน<select id="n_code" class="inp mt-1"><option>ACI 318 (USD)</option><option>EIT 1008 (USD)</option></select></label></div>
 <div class="flex justify-end gap-2 mt-5"><button class="btn btn-s" onclick="closeModal()">ยกเลิก</button><button class="btn btn-p" onclick="newProject($('#n_name').value||'Untitled',$('#n_eng').value,$('#n_cli').value,$('#n_code').value);closeModal()">สร้าง</button></div>`)}
function showOpen(){modal(`<h2 class="text-lg font-bold mb-4">เปิดไฟล์ · Open Project</h2>
 <input type="file" id="o_file" accept=".json,application/json" class="inp mb-3">
 <p class="mu mb-1">หรือวาง JSON:</p><textarea id="o_txt" rows="6" class="inp font-mono text-xs"></textarea>
 <div class="flex justify-end gap-2 mt-5"><button class="btn btn-s" onclick="closeModal()">ยกเลิก</button><button class="btn btn-p" onclick="const t=$('#o_txt').value.trim();if(!t)return alert('เลือกไฟล์หรือวาง JSON');closeModal();loadProject(t)">เปิด</button></div>`);
 $('#o_file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#o_txt').value=r.result};r.readAsText(f)}}
function showSave(){if(!state.project)return;modal(`<h2 class="text-lg font-bold mb-2">บันทึกไฟล์ · Save Project</h2><p class="mu mb-3">ดาวน์โหลดเป็น .json หรือคัดลอกข้อความไปเก็บเอง</p>
 <textarea id="s_txt" rows="8" readonly class="inp font-mono text-xs">${JSON.stringify(state.project,null,2).replace(/</g,'&lt;')}</textarea>
 <div class="flex justify-end gap-2 mt-5"><button class="btn btn-s" onclick="closeModal()">ปิด</button><button class="btn btn-s" onclick="$('#s_txt').select();document.execCommand('copy')">คัดลอก</button><button class="btn btn-p" onclick="dl()">ดาวน์โหลด</button></div>`)}
function dl(){saveFile((state.project.meta.name||'project').replace(/\s+/g,'_')+'.rcd.json',JSON.stringify(state.project,null,2),'application/json')}

/* stair: one-way waist-slab stair, simple flight, designed per 1 m width (USD). Base units: kg, cm, t, m, ksc */
const STAIR_DEF={H:1.6,r:16,t:28,Lext:.3,h:15,cover:2.5,support:'simple',fc:240,fy:4000,bar:12,barT:10,phiF:.9,phiV:.85,DL:.1,LL:.3,kM:8};
const curStair=()=>curItem().data;
function sIn(el){const d=curStair(),k=el.dataset.k;if(el.dataset.s)d[k]=isNaN(+el.value)?el.value:+el.value;else d[k]=parseFloat(el.value)/(el.dataset.q?U(el.dataset.q)[1]:1);autosave();$('#sOut').innerHTML=stairResult()}
function stairCalc(d){
 const N=Math.max(1,Math.round(d.H*100/d.r)),r=d.H*100/N,t=d.t,Lf=(N-1)*t/100,L=Lf+d.Lext,th=Math.atan(r/t),cs=Math.cos(th),PHf=d.phiF,PVf=d.phiV;
 const wsw=2.4*(d.h/100)/cs,wst=2.4*(r/2)/100,DLt=wsw+wst+d.DL,wu=1.4*DLt+1.7*d.LL,Mu=wu*L*L/d.kM,Vu=wu*L/2*1e3;
 const b=100,h=d.h,db=+d.bar,dd=h-d.cover-db/20,fc=d.fc,fy=d.fy,b1=beta1(fc),rb=.85*b1*fc/fy*6120/(6120+fy),rmax=.75*rb;
 const rs=fy<=3000?.002:fy<=4000?.002-(fy-3000)/1000*.0002:Math.max(.0014,.0018*4000/fy),Asmin=rs*b*h,hmin=L*100/{simple:20,one:24,both:28,cant:10}[d.support]*(fy===4000?1:.4+fy/7000);
 const g={N,r,t,Lf,L,th,wsw,wst,DLt,wu,Mu,Vu,dd,rmax,Asmin,hmin,rs},Ru=Mu*1e5/(PHf*b*dd*dd),disc=1-2*Ru/(.85*fc);g.Ru=Ru;
 if(!(disc>=0)){g.fail=1;return g}
 g.rreq=.85*fc/fy*(1-Math.sqrt(disc));const Ab=BAR[db];g.Asreq=Math.max(g.rreq*b*dd,Asmin);g.smax=Math.min(3*h,45);
 g.s=Math.max(2.5,Math.floor(Math.min(Ab*b/g.Asreq,g.smax)/2.5)*2.5);g.Asp=Ab*b/g.s;const a=g.Asp*fy/(.85*fc*b);g.phiMn=PHf*g.Asp*fy*(dd-a/2)/1e5;
 g.Asd=rs*b*h;g.sT=Math.max(2.5,Math.floor(Math.min(BAR[+d.barT]*b/g.Asd,5*h,45)/2.5)*2.5);
 g.phiVc=PVf*.53*Math.sqrt(fc)*b*dd;g.clr=g.s-db/10;g.minClr=Math.max(db/10,2.5);return g}
function stairSketch(N,r,t,h){const th=Math.atan(r/t),hv=h/Math.cos(th),Lf=(N-1)*t,H=N*r,sc=210/Math.max(Lf,H),pad=14,W=Lf*sc+2*pad,Hh=(H+hv)*sc+2*pad,X=x=>(pad+x*sc).toFixed(1),Y=y=>(pad+(H-y)*sc).toFixed(1);
 let p=`M${X(0)} ${Y(0)}`;for(let i=1;i<=N;i++){p+=`L${X((i-1)*t)} ${Y(i*r)}`;if(i<N)p+=`L${X(i*t)} ${Y(i*r)}`}
 return `<svg viewBox="0 0 ${W.toFixed(1)} ${Hh.toFixed(1)}" class="mx-auto" style="max-height:230px;width:auto"><path d="${p}" fill="none" stroke="#2563eb" stroke-width="1.8"/><path d="M${X(0)} ${Y(0)}L${X(0)} ${Y(r-hv)}L${X(Lf)} ${Y(H-hv)}L${X(Lf)} ${Y(H)}" fill="none" stroke="#64748b" stroke-width="1.8"/></svg><div class="text-center text-[11px] mu">ผิวบันได (น้ำเงิน) · ท้องแผ่น (เทา)</div>`}
function stairResult(d=curStair()){lastInfo={ok:false,dbl:false,bars:'—'};
 if(![d.H,d.r,d.t,d.h,d.cover,d.fc,d.fy,d.phiF,d.phiV,d.kM].every(x=>x>0)||!(d.Lext>=0&&d.DL>=0&&d.LL>=0))return '<p class="mu">กรอกข้อมูลให้ครบ</p>';
 const g=stairCalc(d),f=(x,n=2)=>(+x).toFixed(n);
 if(g.fail)return '<div class="p-3 rounded bg-red-600 text-white font-bold">หน้าตัดเล็กเกินไปสำหรับ Mu — เพิ่มความหนา h</div>';
 const okH=d.h>=g.hmin,okMn=g.phiMn>=g.Mu-1e-6,okV=g.Vu<=g.phiVc,okR=g.rreq<=g.rmax,okS=g.clr>=g.minClr-1e-9,all=okH&&okMn&&okV&&okR&&okS,e=2*g.r+g.t,eOK=e>=60&&e<=65;
 lastInfo={ok:all,dbl:false,bars:`ลูกตั้ง ${g.N} · h ${f(cv(d.h,'len'),0)} ${U('len')[0]} · DB${d.bar}@${f(cv(g.s,'len'),1)}`};
 return `<div class="grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">1 · รูปทรงบันได</div>${rw('จำนวนลูกตั้ง',g.N+' ขั้น')}${rw('ลูกตั้งจริง r = H/N',fx(g.r,'len'))}${rw('ลูกนอน t',fx(g.t,'len'))}${rw('มุมเอียง θ',f(g.th*180/Math.PI,1)+'°')}${rw('2r + t (แนะนำ 60–65 ซม.)',fx(e,'len',1)+(eOK?' ✓':' ⚠'))}${rw('ความยาวแนวราบ + ช่วงรับเพิ่ม = L',`${fx(g.Lf,'L')} + ${fx(d.Lext,'L')} = <b>${fx(g.L,'L')}</b>`)}</div><div>${stairSketch(g.N,g.r,g.t,d.h)}</div></div>
 <div class="mt-4 grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">2 · น้ำหนักบรรทุก (ต่อ ตร.ม. แนวราบ)</div>${rw('แผ่นท้อง γc·h/cosθ',fx(g.wsw,'ar'))}${rw('ขั้นบันได γc·r/2',fx(g.wst,'ar'))}${rw('ผิว/ราว',fx(d.DL,'ar'))}${rw('DL รวม',fx(g.DLt,'ar'))}${rw('LL',fx(d.LL,'ar'))}${rw('wu = 1.4DL+1.7LL',`<b>${fx(g.wu,'ar')}</b>`)}${rw('Mu = wuL²/'+d.kM+' (ต่อ 1 ม.)',fx(g.Mu,'M'))}${rw('Vu = wuL/2',fx(g.Vu/1e3,'F'))}</div>
 <div><div class="font-semibold mb-1">3 · ความหนาและเหล็กเสริมหลัก</div>${rw('h min',fx(g.hmin,'len'),okH)}${rw('d',fx(g.dd,'len'))}${rw('Ru = Mu/φbd²',fx(g.Ru,'str'))}${rw('ρreq ≤ ρmax',`${f(g.rreq,5)} ≤ ${f(g.rmax,5)}`,okR)}${rw('As min (ชดเชยหดตัว '+f(g.rs,4)+'·bh)',fx(g.Asmin,'Am'))}${rw('As ที่ต้องการ',fx(g.Asreq,'Am'))}${rw('เหล็กเสริมหลัก (ตามความลาด)',`<b>DB${d.bar} @ ${fx(g.s,'len',1)}</b> (${fx(g.Asp,'Am')})`)}${rw('ระยะห่างว่างเหล็ก',`${fx(g.clr,'len')} (min ${fx(g.minClr,'len')})`,okS)}${rw('φMn ≥ Mu',`${f(cv(g.phiMn,'M'))} ≥ ${fx(g.Mu,'M')}`,okMn)}</div></div>
 <div class="mt-4 grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">4 · เหล็กกันร้าว/กระจาย (ตั้งฉาก)</div>${rw('As = ρ·b·h',fx(g.Asd,'Am'))}${rw('เหล็กกระจาย',`<b>DB${d.barT} @ ${fx(g.sT,'len',1)}</b>`)}</div>
 <div><div class="font-semibold mb-1">5 · แรงเฉือน (φ = ${d.phiV}, ไม่ใช้เหล็กปลอก)</div>${rw('φVc = φ·0.53√fc′·b·d',fx(g.phiVc/1e3,'F'))}${rw('Vu ≤ φVc',`${f(cv(g.Vu/1e3,'F'))} ≤ ${fx(g.phiVc/1e3,'F')}`,okV)}</div></div>
 <div class="mt-4 p-3 rounded text-white font-bold text-center ${all?'bg-green-600':'bg-red-600'}">${all?'✔ ออกแบบบันไดผ่านทุกเงื่อนไข':'✘ ไม่ผ่านบางเงื่อนไข — เพิ่ม h หรือปรับเหล็ก'}</div>`}
function stairInputsHtml(d){const L=[['H / r / t',`${fx(d.H,'L')} / ${fx(d.r,'len',1)} / ${fx(d.t,'len',1)}`],['ช่วงรับเพิ่ม',fx(d.Lext,'L')],['h แผ่นท้อง / ระยะหุ้ม',`${fx(d.h,'len',1)} / ${fx(d.cover,'len',1)}`],['fc′ / fy',`${fx(d.fc,'str',0)} / ${fx(d.fy,'str',0)}`],['เหล็กหลัก / กระจาย',`DB${d.bar} / DB${d.barT}`],['φ ดัด / φ เฉือน',`${d.phiF} / ${d.phiV}`],['DL เพิ่มเติม / LL',`${fx(d.DL,'ar')} / ${fx(d.LL,'ar')}`],['ตัวหารโมเมนต์',`wL²/${d.kM}`]];
 return `<div class="grid sm:grid-cols-2 gap-x-6">${L.map(([a,b])=>rw(a,b)).join('')}</div>`}
function stairView(){const d=curStair(),B=[10,12,16,20].map(k=>[k,'DB'+k]);
 return `<p class="mu mb-3">บันไดพื้นท้องเรียบ (waist slab) ช่วงเดียว · ออกแบบต่อความกว้าง 1 ม. · USD</p><div class="grid xl:grid-cols-5 gap-4"><div class="xl:col-span-2 space-y-4">
 <section class="panel"><div class="ph">1 · Geometry</div><div class="p-4 grid grid-cols-2 gap-3">${fld('H','ความสูงช่วงบันได H','L',d.H)}${fld('r','ลูกตั้ง r (ประมาณ)','len',d.r)}${fld('t','ลูกนอน t','len',d.t)}${fld('Lext','ช่วงรับเพิ่ม (พื้นพัก)','L',d.Lext)}${fld('h','ความหนาแผ่นท้อง h','len',d.h)}${fld('cover','ระยะหุ้ม','len',d.cover)}${sel('support','รูปแบบการรองรับ (h min)',[['simple','ช่วงเดียว · L/20'],['one','ต่อเนื่องปลายเดียว · L/24'],['both','ต่อเนื่องสองปลาย · L/28'],['cant','ปลายยื่น · L/10']],d.support,'col-span-2')}</div></section>
 <section class="panel"><div class="ph">2 · Materials & Bars</div><div class="p-4 grid grid-cols-2 gap-3">${fld('fc','fc′','str',d.fc)}${fld('fy','fy','str',d.fy)}${sel('bar','เหล็กหลัก',B,d.bar)}${sel('barT','เหล็กกระจาย',[[10,'DB10'],[12,'DB12']],d.barT)}${fld('phiF','φ ดัด','',d.phiF)}${fld('phiV','φ เฉือน','',d.phiV)}</div></section>
 <section class="panel"><div class="ph">3 · Loads</div><div class="p-4 grid grid-cols-2 gap-3">${fld('DL','DL เพิ่มเติม (ผิว/ราว)','ar',d.DL)}${fld('LL','LL','ar',d.LL)}${sel('kM','ตัวหารโมเมนต์ Mu = wuL²/k',[[8,'k = 8 (ช่วงเดียว)'],[10,'k = 10'],[12,'k = 12'],[14,'k = 14']],d.kM,'col-span-2')}</div></section>
 </div><section class="panel xl:col-span-3"><div class="ph">Results · ผลการออกแบบ</div><div id="sOut" class="p-4"></div></section></div>`}

/* slab: one-way RC slab (ACI/วสท. USD), two-way RC slab (coefficient method 2), CPAC precast (hollow core / plank) */
const CALC=['beam','stair','slab'];

/* saving files: published pages cannot trigger downloads directly -> use the viewer-confirmed `downloads` capability, fall back to a plain link elsewhere */
async function saveFile(name,data,mime){try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
/* PDF: the report is cut into whole blocks (rows, tables, sub-panels, drawings) and blocks are never split across pages */
function pdfBlocks(el,maxH,out,brk){let first=true;
 for(const c of [...el.children]){const own=/break-before/.test(c.getAttribute('style')||''),b=(first&&brk)||own;first=false;
  if(!c.offsetHeight)continue;
  if(c.offsetHeight<=maxH||!c.children.length)out.push({el:c,brk:b});else pdfBlocks(c,maxH,out,b)}
 return out}
async function expPdf(){const r=$('#rpt'),btn=$('#pdfBtn');if(!r||!r.children.length)return;
 if(!window.html2canvas||!window.jspdf){alert('โหลดไลบรารี PDF ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต) — ใช้ปุ่มส่งออกเป็น HTML แทนได้');return}
 const old=btn.textContent;btn.textContent='กำลังสร้าง PDF…';btn.disabled=true;let wrap;
 try{wrap=document.createElement('div');wrap.className='pdfwrap';wrap.style.cssText='position:fixed;left:-10000px;top:0;width:794px;padding:24px;box-sizing:border-box;background:#fff;color:#0f172a;font-size:14px;--bg:#fff;--panel:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--inp:#fff';
  wrap.innerHTML=r.innerHTML;document.body.appendChild(wrap);
  try{await document.fonts.ready}catch(e){}await new Promise(x=>setTimeout(x,700));
  for(const v of [...wrap.querySelectorAll('svg')]){const vb=(v.getAttribute('viewBox')||'').split(/\s+/).map(Number);if(vb.length<4)continue;v.setAttribute('width',vb[2]);v.setAttribute('height',vb[3]);v.removeAttribute('style');v.removeAttribute('class');const im=document.createElement('img');im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(v));im.width=vb[2];im.height=vb[3];im.style.cssText='display:block;margin:0 auto';v.replaceWith(im);try{await im.decode()}catch(e){}}
  
  const bimgs=[];for(const sp of [...wrap.querySelectorAll('span')]){const cl=String(sp.className);if(!cl.includes('text-[11px]')||!cl.includes('text-white'))continue;
   const t=sp.textContent.trim(),g=`<svg xmlns="http://www.w3.org/2000/svg" width="46" height="18"><rect width="46" height="18" rx="4" fill="${cl.includes('bg-green')?'#16a34a':'#dc2626'}"/><text x="23" y="13" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#ffffff">${t}</text></svg>`;
   const bi=document.createElement('img');bi.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(g);bi.width=46;bi.height=18;bi.style.cssText='display:inline-block;vertical-align:middle;margin-left:8px';sp.replaceWith(bi);bimgs.push(bi)}
  for(const bi of bimgs){try{await bi.decode()}catch(e){}}
  const pdf=new jspdf.jsPDF({unit:'pt',format:'a4'}),PW=595.28,PH=841.89,M=34,cw=PW-2*M,kpx=cw/(wrap.clientWidth-48),maxH=Math.floor((PH-2*M-14)/kpx);
  const blocks=pdfBlocks(wrap,maxH,[],false);let y=M,first=true;
  blocks.forEach(b=>{b.el.style.paddingTop='2px';b.el.style.paddingBottom=(parseFloat(getComputedStyle(b.el).paddingBottom)+7)+'px'});
  for(const b of blocks){
   const c=await html2canvas(b.el,{scale:2,backgroundColor:'#ffffff',logging:false}),h=b.el.offsetHeight*kpx,w=b.el.offsetWidth*kpx;
   if(!first&&(b.brk||y+h>PH-M-12)){pdf.addPage();y=M}first=false;
   pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',M,y,w,h);y+=h+5}
  const N=pdf.getNumberOfPages();for(let i=1;i<=N;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(i+' / '+N,PW/2,PH-14,{align:'center'})}
  await saveFile((state.project.meta.name||'report').replace(/\s+/g,'_')+'_report.pdf',pdf.output('blob'),'application/pdf');
 }catch(e){if(!(e&&e.code==='declined'))alert('สร้าง PDF ไม่สำเร็จ: '+(e&&e.message||e))}
 finally{if(wrap)wrap.remove();if(btn){btn.textContent=old;btn.disabled=false}}}

/* units: project data is always stored in base units (kg, cm, t, m, ksc); display/input convert automatically */
const UN={
 metric:{n:'Metric · t-m-cm-ksc',len:['cm',1],L:['m',1],str:['ksc',1],ld:['t/m',1],F:['t',1],M:['t·m',1],A:['cm²',1],ar:['t/m²',1],Am:['cm²/m',1]},
 si:{n:'SI · kN-m-mm-MPa',len:['mm',10],L:['m',1],str:['MPa',.0980665],ld:['kN/m',9.80665],F:['kN',9.80665],M:['kN·m',9.80665],A:['mm²',100],ar:['kN/m²',9.80665],Am:['mm²/m',100]},
 imp:{n:'US · kip-ft-in-ksi',len:['in',1/2.54],L:['ft',1/.3048],str:['ksi',.0142233],ld:['kip/ft',.671969],F:['kip',2.20462],M:['kip·ft',7.23301],A:['in²',.155],ar:['kip/ft²',.20482],Am:['in²/ft',.04724]}};

const cv=(v,q)=>v*U(q)[1];
const nf=(x,n)=>(+x).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n});
const fx=(v,q,n=2)=>nf(cv(v,q),n)+' '+U(q)[0];

const CV={
 'ความยาว Length':[['mm',.1],['cm',1],['m',100],['in',2.54],['ft',30.48]],
 'แรง Force':[['N',1/9806.65],['kN',.101972],['kgf',.001],['t (tonne-f)',1],['kip',.453592],['lbf',.000453592]],

/* beam — Singly/Doubly RFM, USD (ACI/วสท.). Es=2.04e6 ksc, εu=0.003 → 6120. Base units: kg, cm, t, m, ksc */
const BAR={10:.785,12:1.131,16:2.011,20:3.142,25:4.909,28:6.158,32:8.042};
const SUP={simple:['ช่วงเดียวธรรมดา · Simply supported',16],one:['ต่อเนื่องปลายเดียว · One end continuous',18.5],both:['ต่อเนื่องสองปลาย · Both ends continuous',21],cant:['ปลายยื่น · Cantilever',8]};

/* bar layout: bars spread evenly over layers; clear spacing = max(db, 2.5 cm); yb = centroid from the face */
function lay(n,db,b,c0,st,one){const D=db/10,s=Math.max(D,2.5),u=b-2*c0-2*st/10,nmax=Math.max(1,Math.floor((u+s)/(D+s))),nl=one?1:Math.ceil(n/nmax),cnt=[];let r=n;
 for(let i=0;i<nl;i++){const c=Math.ceil(r/(nl-i));cnt.push(c);r-=c}
 const ys=cnt.map((_,i)=>c0+st/10+D/2+i*(D+s)),yb=cnt.reduce((a,c,i)=>a+c*ys[i],0)/n,k=Math.max(...cnt);
 return{cnt,ys,yb,s,u,clr:k>1?(u-k*D)/(k-1):99}}

/* analysis of a given section (singly if nc=0, doubly otherwise) */
function ana(p){const K=.003*p.Es,PH=p.phi;
 const{b,h,fc,fy}=p,t=lay(p.n,p.db,b,p.cover,p.st,p.one),As=p.n*BAR[p.db],d=h-t.yb;let Asp=0,dp=0,c2=null;
 if(p.nc>0){c2=lay(p.nc,p.dbc,b,p.cover,p.st,p.one);Asp=p.nc*BAR[p.dbc];dp=c2.yb}
 const b1=beta1(fc),rb=.85*b1*fc/fy*K/(K+fy),rmax=.75*rb,rmin=Math.max(.8*Math.sqrt(fc)/fy,14/fy),rho=As/(b*d),rhop=Asp/(b*d);
 const r={t,c2,As,Asp,d,dp,rho,rhop,b1,rb,rmax,rmin,Es:p.Es,Ec:p.Ec};let a;
 if(Asp>0){
  r.rrMin=.85*b1*fc/fy*dp/d*K/(K-fy);let fsp=fy,c;
  if(rho-rhop<r.rrMin){const R=(K*Asp-As*fy)/(1.7*fc*b1*b),Q=K*dp*Asp/(.85*fc*b1*b);c=-R+Math.sqrt(R*R+Q);fsp=K*(1-dp/c)}
  r.fsp=fsp;r.ten=rho-rhop*fsp/fy;a=fsp>=fy?(As-Asp)*fy/(.85*fc*b):b1*c;r.c=c;
  r.Mn=.85*fc*a*b*(d-a/2)+Asp*fsp*(d-dp);r.maxOK=r.ten<=rmax;
 }else{
  if(rho<=rb){a=As*fy/(.85*fc*b);r.Mn=As*fy*(d-a/2)}
  else{const mr=K/(.85*b1*fc)*rho,ku=Math.sqrt(mr+mr*mr/4)-mr/2;a=b1*ku*d;r.fs=.85*fc*a*b/As;r.Mn=As*r.fs*(d-a/2)}
  r.maxOK=rho<=rmax}
 r.a=a;r.phiMn=PH*r.Mn/1e5;r.spOK=t.clr>=t.s-1e-6&&(!c2||c2.clr>=c2.s-1e-6);return r}

/* design: Mu -> singly/doubly -> As, A's -> choose bars (iterate d with actual layers) */
function des(d){const K=.003*d.Es,PH=d.phiF;
 const{b,h,cover,fc,fy,stir,L}=d,db=+d.bar,dbc=+d.barC,Ab=BAR[db],Abc=BAR[dbc];
 const sw=d.selfWt?b*h/1e4*2.4:0,wu=1.4*(d.wD+sw)+1.7*d.wL,Mu=d.useMu?d.Mu:wu*L*L*(d.support==='cant'?.5:.125);
 const b1=beta1(fc),rb=.85*b1*fc/fy*K/(K+fy),rmax=.75*rb,rmin=Math.max(.8*Math.sqrt(fc)/fy,14/fy),Rmax=rmax*fy*(1-.59*rmax*fy/fc);
 const r={sw,wu,Mu,b1,rb,rmax,rmin,Rmax,Es:d.Es,Ec:ecOf(d),hmin:L*100/SUP[d.support][1]*(fy===4000?1:.4+fy/7000)};
 let dd=h-cover-stir/10-db/20;
 for(let i=0;i<5;i++){
  r.d=dd;r.MR=PH*Rmax*b*dd*dd/1e5;r.Rreq=Mu*1e5/(PH*b*dd*dd);
  if(r.Rreq<=Rmax+1e-9){
   r.type='singly';r.rreq=.85*fc/fy*(1-Math.sqrt(1-2*r.Rreq/(.85*fc)));
   r.rho=Math.max(r.rreq,rmin);r.As=r.rho*b*dd;r.Asp=0;r.nc=0;
  }else{
   r.type='doubly';const dp=cover+stir/10+dbc/20;r.dp=dp;r.As1=rmax*b*dd;r.Mu2=Mu-r.MR;r.As2=r.Mu2*1e5/(PH*fy*(dd-dp));
   const a=r.As1*fy/(.85*fc*b),c=a/b1;r.fsp=K*(c-dp)/c;if(!(r.fsp>0)){r.fail=1;return r}
   r.Asp=r.As2*fy/Math.min(r.fsp,fy);r.As=r.As1+r.As2;r.nc=Math.max(2,Math.ceil(r.Asp/Abc-1e-9));
  }
  r.n=Math.max(2,Math.ceil(r.As/Ab-1e-9));
  const nd=h-lay(r.n,db,b,cover,stir,d.oneRow).yb;if(Math.abs(nd-dd)<.005)break;dd=nd}
 r.dReq=Math.sqrt(Mu*1e5/(PH*Rmax*b));r.chk=ana({b,h,cover,st:stir,fc,fy,n:r.n,db,nc:r.nc,dbc,one:d.oneRow,phi:PH,Es:d.Es,Ec:ecOf(d)});return r}

function sect(b,h,c0,st,t,c2,db,dbc){
 const sc=190/Math.max(b,h),W=b*sc,H=h*sc,x0=15,y0=15,D=db/10*sc,Dc=dbc/10*sc,e=(c0+st/10)*sc;
 const row=(k,y,dia,col,u,km)=>{const w=u*sc-dia,pt=km>1?w/(km-1):0,xs=k>=km?Array.from({length:k},(_,i)=>k>1?i*w/(k-1):w/2):k===1?[w/2]:Array.from({length:k},(_,i)=>i*(km-1)/(k-1)*pt);
  return xs.map(x=>`<circle cx="${x0+e+dia/2+x}" cy="${y}" r="${dia/2}" fill="${col}"/>`).join('')};
 let g=`<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="rgba(148,163,184,.25)" stroke="#64748b" stroke-width="2"/><rect x="${x0+c0*sc}" y="${y0+c0*sc}" width="${W-2*c0*sc}" height="${H-2*c0*sc}" rx="4" fill="none" stroke="#059669" stroke-width="1.5"/>`;
 t.cnt.forEach((k,i)=>g+=row(k,y0+H-t.ys[i]*sc,D,'#2563eb',t.u,Math.max(...t.cnt)));
 if(c2)c2.cnt.forEach((k,i)=>g+=row(k,y0+c2.ys[i]*sc,Dc,'#d97706',c2.u,Math.max(...c2.cnt)));
 const nt=(x,n)=>x.cnt.length>1?`<div class="text-[11px] mu text-center">${n}จัด ${x.cnt.join(' + ')} เส้น (${x.cnt.length} ชั้น) — วางแถวเดียวไม่พอที่ระยะห่างขั้นต่ำ</div>`:'';
 return `<svg viewBox="0 0 ${W+30} ${H+30}" class="mx-auto" style="max-height:230px;width:auto">${g}</svg><div class="text-center text-[11px] mu">● เหล็กรับแรงดึง (น้ำเงิน) ${c2?'· ● เหล็กรับแรงอัด (ส้ม)':''}</div>${nt(t,'เหล็กดึง')}${c2?nt(c2,'เหล็กอัด'):''}`}
const ecOf=d=>d.EcAuto?15100*Math.sqrt(d.fc):d.Ec;
function hminHtml(d){if(!(d.L>0&&d.fy>0&&SUP[d.support]))return'';const k=SUP[d.support][1],fac=d.fy===4000?1:.4+d.fy/7000,hm=d.L*100/k*fac;
 return rw('h min = L/'+k+(fac===1?'':' × '+fac.toFixed(3)),`<b>${fx(hm,'len')}</b>`)+rw('h ที่ใช้',fx(d.h,'len'),d.h>=hm)}
function shearCalc(d,Vu,dd){
 const fc=Math.sqrt(d.fc),pV=d.phiV,Vc=.53*fc*d.b*dd,pVc=pV*Vc,Av=d.legs*Math.PI*(d.stir/10)**2/4,sMin=Av*d.fy/(3.5*d.b),Vs=Math.max(0,Vu/pV-Vc),V1=1.1*fc*d.b*dd,V2=2.1*fc*d.b*dd,fl=x=>Math.max(2.5,Math.floor(x/.5)*.5);
 let txt,sv=0,ok=true;
 if(Vu<=pVc/2)txt='Vu ≤ φVc/2 → ไม่ต้องการเหล็กเสริมรับแรงเฉือน';
 else if(Vu<=pVc){sv=fl(Math.min(sMin,dd/2,60));txt='φVc/2 < Vu ≤ φVc → เหล็กเสริมเฉือนขั้นต่ำ'}
 else if(Vs<=V1){sv=fl(Math.min(Av*d.fy*dd/Vs,sMin,dd/2,60));txt='Vs ≤ 1.1√fc′bd → s ≤ d/2, 60 ซม.'}
 else if(Vs<=V2){sv=fl(Math.min(Av*d.fy*dd/Vs,sMin,dd/4,30));txt='1.1√fc′bd < Vs ≤ 2.1√fc′bd → s ≤ d/4, 30 ซม.'}
 else{ok=false;txt='Vs > 2.1√fc′bd → ต้องเพิ่มขนาดหน้าตัด'}
 return{Vc,pVc,Av,sMin,Vs,V1,V2,sv,txt,ok}}
function shearAnaHtml(d,Vu,dd){
 if(!(d.s>0))return{html:'',ok:true};
 const k=shearCalc(d,Vu,dd),Vsp=k.Av*d.fy*dd/d.s,pVn=d.phiV*(k.Vc+Math.min(Vsp,k.V2)),ref=Vu>0?k.Vs:Vsp,smax=ref<=k.V1?Math.min(dd/2,60):Math.min(dd/4,30);
 const okV=Vsp<=k.V2,okS=d.s<=Math.min(smax,k.sMin)+1e-9,okD=Vu>0?pVn>=Vu:true;
 let h=`<div class="mt-4"><div class="font-semibold mb-1">แรงเฉือน · เหล็กปลอก (φ = ${d.phiV})</div>${rw('เหล็กปลอก',`<b>${d.legs} ขา RB${d.stir} @ ${fx(d.s,'len',1)}</b> (Av = ${fx(k.Av,'A')})`)}${rw('Vc = 0.53√fc′·b·d',fx(k.Vc/1e3,'F'))}${rw('φVc',fx(k.pVc/1e3,'F'))}${rw('Vs = Av·fy·d/s',fx(Vsp/1e3,'F'))}${rw('Vs ≤ 2.1√fc′bd',`${f2(cv(Vsp/1e3,'F'))} ≤ ${fx(k.V2/1e3,'F')}`,okV)}${rw('s ≤ s max (d/2·60 หรือ d/4·30, 3.5b)',`${fx(d.s,'len',1)} ≤ ${fx(Math.min(smax,k.sMin),'len',1)}`,okS)}${rw('φVn = φ(Vc+Vs)',`<b>${fx(pVn/1e3,'F')}</b>`)}`;
 if(Vu>0)h+=rw('φVn ≥ Vu',`${f2(cv(pVn/1e3,'F'))} ≥ ${fx(Vu/1e3,'F')}`,okD)+rw('กรณี',k.txt)+(k.sv?rw('ระยะเหล็กปลอกที่ต้องการ',fx(k.sv,'len',1)):'');
 return{html:h+'</div>',ok:okV&&okS&&okD}}
function bIn(el){if(state.page==='stair')return sIn(el);if(state.page==='slab')return slIn(el);const d=curBeam(),k=el.dataset.k;
 if(el.type==='checkbox')d[k]=el.checked;else if(el.dataset.s)d[k]=isNaN(+el.value)?el.value:+el.value;else d[k]=parseFloat(el.value)/(el.dataset.q?U(el.dataset.q)[1]:1);

 if(k==='fc'&&d.EcAuto){const e=document.querySelector('[data-k=Ec]');if(e)e.value=+cv(15100*Math.sqrt(d.fc),'str').toPrecision(6)}
 autosave();if(el.dataset.f)render();else{$('#bOut').innerHTML=beamResult();$('#hmin').innerHTML=hminHtml(d)}}
function beamView(){

 const tab=(m,t)=>`<button class="btn ${d.mode===m?'btn-p':'btn-s'}" onclick="curBeam().mode='${m}';autosave();render()">${t}</button>`;
 return `<div class="flex gap-2 mb-2">${tab('design','ออกแบบ · Design')}${tab('analysis','วิเคราะห์ · Analysis')}</div>
 <p class="mu mb-3">${an?'ตรวจสอบกำลังต้านทานโมเมนต์ดัด φMn ของหน้าตัดที่กำหนดเหล็กเสริมไว้ (Singly / Doubly)':'Mu → ตรวจ Singly/Doubly → As, As′ → เลือกเหล็ก → ตรวจสอบ'} · USD</p>
 <div class="grid xl:grid-cols-5 gap-4"><div class="xl:col-span-2 space-y-4">
 <section class="panel"><div class="ph">1 · Geometry</div><div class="p-4 grid grid-cols-2 gap-3">${fld('b','b กว้าง','len',d.b)}${fld('h','h ลึก','len',d.h)}${fld('cover','ระยะหุ้ม','len',d.cover)}${fld('L','ช่วง L','L',d.L)}${sel('support','รูปแบบการรองรับ (h min)',Object.entries(SUP).map(([k,v])=>[k,v[0]]),d.support,'col-span-2')}<div id="hmin" class="col-span-2"></div></div></section>
 <section class="panel"><div class="ph">2 · Materials & Bars</div><div class="p-4 grid grid-cols-2 gap-3">
  ${fld('fc','fc′','str',d.fc)}${fld('fy','fy','str',d.fy)}${fld('Ec','Ec (โมดูลัสยืดหยุ่นคอนกรีต)','str',ecOf(d))}${fld('Es','Es (โมดูลัสยืดหยุ่นเหล็ก)','str',d.Es)}
  <label class="col-span-2 flex items-center gap-2 text-xs mu"><input type="checkbox" data-k="EcAuto" data-f="1" ${d.EcAuto?'checked':''} onchange="bIn(this)"> คำนวณ Ec = 15,100√fc′ (ksc) อัตโนมัติ · ใช้ Es หา εu·Es = 0.003Es (6,120 ที่ Es = 2.04×10⁶ ksc)</label>
  <label class="col-span-2 flex items-center gap-2 text-xs mu"><input type="checkbox" data-k="oneRow" ${d.oneRow?'checked':''} onchange="bIn(this)"> บังคับเหล็กทุกเส้นอยู่แถวเดียว (ชั้นเดียว) — ถ้าแน่นเกินไปจะแจ้ง FAIL ที่ระยะห่างเหล็ก</label>
  ${fld('phiF','φ ดัด (Flexure)','',d.phiF)}${fld('phiV','φ เฉือน (Shear)','',d.phiV)}
  ${sel('bar','เหล็กรับแรงดึง',B,d.bar)}${an?fld('n','จำนวนเหล็กดึง','',d.n):sel('barC','เหล็กรับแรงอัด',B,d.barC)}${an?sel('barC','เหล็กรับแรงอัด',B,d.barC):sel('stir','เหล็กปลอก RB',[6,9,12].map(x=>[x,'RB'+x]),d.stir)}${an?fld('nc','จำนวนเหล็กอัด (0=Singly)','',d.nc):sel('legs','จำนวนขาเหล็กปลอก',[2,3,4].map(x=>[x,x+' ขา']),d.legs)}
  ${an?sel('stir','เหล็กปลอก RB',[6,9,12].map(x=>[x,'RB'+x]),d.stir)+sel('legs','จำนวนขาเหล็กปลอก',[2,3,4].map(x=>[x,x+' ขา']),d.legs):''}</div></section>
 ${an?`<section class="panel"><div class="ph">3 · Shear · แรงเฉือน</div><div class="p-4 grid grid-cols-2 gap-3">${fld('Vu','Vu (0 = ไม่ตรวจ)','F',d.Vu)}${fld('s','ระยะเหล็กปลอก s','len',d.s)}</div></section>`:`<section class="panel"><div class="ph">3 · Loads</div><div class="p-4 grid grid-cols-2 gap-3">

  <label class="col-span-2 flex items-center gap-2"><input type="checkbox" data-k="useVu" data-f="1" ${d.useVu?'checked':''} onchange="bIn(this)"> ระบุ Vu โดยตรง (ไม่เช่นนั้น Vu = wuL/2 จากน้ำหนักบรรทุก)</label>

const f2=(x,n=2)=>(+x).toFixed(n),f5=x=>(+x).toFixed(5);

function typeBanner(dbl,sub){return `<div class="p-4 rounded-lg mb-4 text-white" style="background:${dbl?'#c2410c':'#1d4ed8'}"><div class="text-xs opacity-80">ชนิดของคาน · Beam type</div><div class="text-xl font-extrabold">${dbl?'Doubly Reinforced Beam':'Singly Reinforced Beam'}</div><div class="text-sm">${dbl?'เสริมเหล็กทั้งรับแรงดึงและรับแรงอัด':'เสริมเหล็กรับแรงดึงอย่างเดียว'}</div>${sub?`<div class="text-xs mt-1 opacity-90">${sub}</div>`:''}</div>`}
function limits(r){return rw('Ec / Es (n = Es/Ec)',`${fx(r.Ec,'str',0)} / ${fx(r.Es,'str',0)} (${f2(r.Es/r.Ec,1)})`)+rw('β₁',f2(r.b1))+rw('ρmin',f5(r.rmin))+rw('ρb',f5(r.rb))+rw('ρmax = 0.75ρb',f5(r.rmax))}

 const r=ana({b:d.b,h:d.h,cover:d.cover,st:d.stir,fc:d.fc,fy:d.fy,n:d.n,db:+d.bar,nc:d.nc,dbc:+d.barC,one:d.oneRow,phi:d.phiF,Es:d.Es,Ec:ecOf(d)}),dbl=r.Asp>0,minOK=r.rho>=r.rmin,all=minOK&&r.maxOK&&r.spOK;
 let h=typeBanner(dbl,dbl?'พิจารณาเหล็กรับแรงอัด As′ ร่วมกับเหล็กดึง (ตรวจ fs′ ว่าคราก/ไม่คราก)':(r.maxOK?'ไม่มีเหล็กรับแรงอัด':'ρ > ρmax — ควรเพิ่มเหล็กรับแรงอัด (Doubly) หรือเพิ่มขนาดหน้าตัด'))+`<div class="grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">ข้อมูลหน้าตัด</div>${rw('เหล็กดึง As',`<b>${d.n}-DB${d.bar}</b> = ${fx(r.As,'A')}`)}${dbl?rw('เหล็กอัด As′',`<b>${d.nc}-DB${d.barC}</b> = ${fx(r.Asp,'A')}`):''}
 ${rw('d',fx(r.d,'len'))}${dbl?rw('d′',fx(r.dp,'len')):''}${rw('ρ = As/bd',f5(r.rho),minOK)}${dbl?rw('ρ′ = As′/bd',f5(r.rhop)):''}
 <div class="font-semibold mt-3 mb-1">เกณฑ์</div>${limits(r)}${rw('ระยะห่างเหล็ก',`${fx(r.t.clr,'len')} (min ${fx(r.t.s,'len')})`,r.spOK)}</div><div>${sect(d.b,d.h,d.cover,d.stir,r.t,r.c2,+d.bar,+d.barC)}</div></div>
 <div class="mt-4"><div class="font-semibold mb-1">กำลังต้านทาน · Flexural strength</div>`;
 if(dbl){h+=rw('(ρ−ρ′)min',f5(r.rrMin))+rw('(ρ−ρ′)',f5(r.rho-r.rhop))+rw('เหล็กอัด fs′',r.fsp>=d.fy?'ครากแล้ว (fs′ = fy)':'ยังไม่คราก · fs′ = '+fx(r.fsp,'str',0))+rw('ρ−ρ′·fs′/fy ≤ ρmax',`${f5(r.ten)} ≤ ${f5(r.rmax)}`,r.maxOK)}
 else h+=rw('สภาวะการวิบัติ',r.rho<=r.rb?'เหล็กคราก (Under-reinforced, ductile)':'คอนกรีตแตกก่อน (Over-reinforced)')+rw('ρ ≤ ρmax',`${f5(r.rho)} ≤ ${f5(r.rmax)}`,r.maxOK);
 h+=rw('a',fx(r.a,'len'))+rw('Mn',fx(r.Mn/1e5,'M'))+rw('φMn',`<b>${fx(r.phiMn,'M')}</b>`)+`</div>`;const sh=shearAnaHtml(d,(d.Vu||0)*1e3,r.d);lastInfo={ok:all&&sh.ok,dbl,bars:`${d.n}-DB${d.bar}`+(dbl?` / ${d.nc}-DB${d.barC}′`:'')};h+=sh.html+`<div class="mt-4 p-3 rounded text-white font-bold text-center ${all&&sh.ok?'bg-green-600':'bg-red-600'}">${all&&sh.ok?'✔ หน้าตัดผ่านเกณฑ์':'✘ ไม่ผ่านเกณฑ์บางข้อ'}</div>`;return h}

function desResult(d){
 const r=des(d);if(r.fail)return '<div class="p-3 rounded bg-red-600 text-white font-bold">ไม่สามารถออกแบบ Doubly ได้ (fs′ ≤ 0) — เพิ่มขนาดหน้าตัด</div>';
 const c=r.chk,dbl=r.type==='doubly',bd=d.b/r.d,Vu=d.useVu?d.Vu*1e3:d.useMu?0:r.wu*d.L*(d.support==='cant'?1:.5)*1e3;
 const okM=c.phiMn>=r.Mu-1e-6,okH=d.h>=r.hmin,all=okM&&c.spOK&&c.maxOK&&okH&&c.rho>=r.rmin-1e-9;
 let h=typeBanner(dbl,`Ru-req = ${fx(r.Rreq,'str',1)} ${dbl?'>':'≤'} Ru-max = ${fx(r.Rmax,'str',1)} `+(dbl?'→ ต้องเสริมเหล็กรับแรงอัด · หรือเพิ่มขนาดหน้าตัดให้ d ≥ '+fx(r.dReq,'len')+' (h ≈ '+fx(r.dReq+d.h-c.d,'len')+') เพื่อเป็น Singly':'→ เหล็กรับแรงดึงอย่างเดียวเพียงพอ'))+`<div class="grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">1 · แรงกระทำ</div>${d.useMu?'':rw('น้ำหนักคาน',fx(r.sw,'ld'))+rw('wu = 1.4DL+1.7LL',fx(r.wu,'ld'))}${rw('Mu',fx(r.Mu,'M'))}
 <div class="font-semibold mt-3 mb-1">2 · ขนาดหน้าตัด</div>${rw('h min',fx(r.hmin,'len'),okH)}${rw('d (ตามชั้นเหล็กจริง)',fx(c.d,'len'))}${rw('b/d (0.25–0.60)',f2(d.b/c.d),d.b/c.d>=.25&&d.b/c.d<=.6)}</div>
 <div>${sect(d.b,d.h,d.cover,d.stir,c.t,c.c2,+d.bar,+d.barC)}</div></div>
 <div class="mt-4 grid lg:grid-cols-2 gap-x-6"><div><div class="font-semibold mb-1">3 · ตรวจสอบ Singly / Doubly</div>${limits(r)}${rw('Ru-req = Mu/φbd²',fx(r.Rreq,'str'))}${rw('Ru-max',fx(r.Rmax,'str'))}${rw('MR = φRu-max·b·d²',fx(r.MR,'M'))}
 ${rw('Ru-req vs Ru-max',`<b>${dbl?'Ru-req > Ru-max → Doubly':'Ru-req ≤ Ru-max → Singly'}</b>`)}</div>
 <div><div class="font-semibold mb-1">4 · เหล็กเสริม</div>${dbl?rw('As1 = ρmax·b·d',fx(r.As1,'A'))+rw('Mu2 = Mu − MR',fx(r.Mu2,'M'))+rw('As2 = Mu2/φfy(d−d′)',fx(r.As2,'A'))+rw('fs′ = εu·Es(c−d′)/c',(r.fsp>=d.fy?'≥ fy → ':'< fy → ')+fx(Math.min(r.fsp,d.fy),'str',0))+rw('As′',fx(r.Asp,'A')):rw('ρreq / ρmin',`${f5(r.rreq)} / ${f5(r.rmin)}`)+(r.rreq<r.rmin?'<div class="text-xs text-amber-600 py-1">ρreq < ρmin → ใช้ ρmin</div>':'')+rw('ρ ที่ใช้',f5(r.rho))}
 ${rw('As ต้องการ',fx(r.As,'A'))}${rw('เลือกเหล็กดึง',`<b>${r.n}-DB${d.bar}</b> (${fx(c.As,'A')})`)}${dbl?rw('เลือกเหล็กอัด',`<b>${r.nc}-DB${d.barC}</b> (${fx(c.Asp,'A')})`):''}</div></div>
 <div class="mt-4"><div class="font-semibold mb-1">5 · ตรวจสอบขั้นสุดท้าย</div>${rw('φMn ≥ Mu',`${f2(cv(c.phiMn,'M'))} ≥ ${fx(r.Mu,'M')}`,okM)}${rw('ระยะห่างเหล็ก ≥ max(db, 2.5 cm)',`${fx(c.t.clr,'len')} (min ${fx(c.t.s,'len')})`,c.spOK)}${rw('ρ ≥ ρmin และ ≤ ρmax',`${f5(c.rho)}`,c.rho>=r.rmin-1e-9&&c.maxOK)}</div>`;
 let shOK=true;if(Vu>0){const k=shearCalc(d,Vu,c.d);shOK=k.ok;h+=`<div class="mt-4"><div class="font-semibold mb-1">6 · แรงเฉือน (φ = ${d.phiV})</div>${rw('Vu',fx(Vu/1e3,'F'))}${rw('φVc',fx(k.pVc/1e3,'F'))}${rw('Av ('+d.legs+' ขา RB'+d.stir+')',fx(k.Av,'A'))}${rw('กรณี',k.txt,k.ok)}${k.sv?rw('เหล็กปลอก',`<b>${d.legs} ขา RB${d.stir} @ ${fx(k.sv,'len',1)}</b>`):''}</div>`}else h+='<div class="mt-4 mu text-xs">ระบุ Vu ในหัวข้อ 3 เพื่อออกแบบเหล็กเสริมรับแรงเฉือน</div>';
 lastInfo={ok:all&&shOK,dbl,bars:`${r.n}-DB${d.bar}`+(dbl?` / ${r.nc}-DB${d.barC}′`:'')};return h+`<div class="mt-4 p-3 rounded text-white font-bold text-center ${all&&shOK?'bg-green-600':'bg-red-600'}">${all&&shOK?'✔ ออกแบบผ่านทุกเงื่อนไข':'✘ ไม่ผ่านบางเงื่อนไข — ปรับขนาดหน้าตัด/เหล็ก'}</div>`}

/* router */
function render(){
 let body;
 if(!state.project)body=welcome();
 else if(state.page==='dashboard')body=dashboard();
 
 else if(state.page==='export')body=exportView();
 else{const it=curItem();body=itemBar(state.page)+(!it?'<p class="mu">ยังไม่มีงานในหมวดนี้ — กด ＋ เพิ่ม</p>':state.page==='beam'?beamView():state.page==='stair'?stairView():state.page==='slab'?slabView():placeholder(state.page))}
 $('#app').innerHTML=sidebar()+`<div class="flex-1 min-w-0 flex flex-col h-full"><div class="noprint">${topbar()}</div><main class="flex-1 overflow-auto p-4 lg:p-6">${body}</main></div>`;
 if(state.project&&state.page==='stair'&&curItem())$('#sOut').innerHTML=stairResult();
 if(state.project&&state.page==='slab'&&curItem())$('#slOut').innerHTML=slabResult();
 if(state.project&&state.page==='beam'&&curItem()){$('#bOut').innerHTML=beamResult();$('#hmin').innerHTML=hminHtml(curBeam())}
}
render();
</script>
